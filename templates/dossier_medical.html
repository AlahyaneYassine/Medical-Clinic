<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dossier Médical - {{ patient.prenom }} {{ patient.nom }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #dbeafe;
            --secondary: #10b981;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #1f2937;
            --light: #f9fafb;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --rounded-sm: 0.375rem;
            --rounded: 0.5rem;
            --rounded-md: 0.75rem;
            --rounded-lg: 1rem;
            --rounded-xl: 1.25rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--dark);
        }

        .patient-card {
            background: var(--white);
            border-radius: var(--rounded-lg);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .patient-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 2rem;
        }

        .patient-info h2 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .patient-info p {
            color: var(--gray);
        }

        .medical-form {
            background: var(--white);
            border-radius: var(--rounded-lg);
            box-shadow: var(--shadow-sm);
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: var(--rounded-md);
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .stats-card {
            background: var(--white);
            border-radius: var(--rounded-lg);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .stats-card h3 {
            font-size: 0.875rem;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .stats-card p {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--rounded-md);
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .patient-card {
                flex-direction: column;
                text-align: center;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-file-medical" style="color: var(--primary); margin-right: 0.5rem;"></i> Dossier Médical</h1>
        </div>

        <div class="patient-card">
            <div class="patient-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="patient-info">
                <h2>{{ patient.prenom }} {{ patient.nom }}</h2>
                <p>Patient depuis le {{ patient.date_inscription|date:"d/m/Y" }}</p>
            </div>
        </div>

        <div class="stats-card">
            <h3>Nombre de visites passées</h3>
            <p>{{ nombre_visites }}</p>
        </div>

        <form method="post" class="medical-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label><i class="fas fa-history" style="color: var(--warning); margin-right: 0.5rem;"></i> Antécédents médicaux</label>
                <textarea name="antecedents" rows="6">{{ dossier.antecedents }}</textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-prescription-bottle-alt" style="color: var(--secondary); margin-right: 0.5rem;"></i> Traitements en cours</label>
                <textarea name="traitements" rows="6">{{ dossier.traitements }}</textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-allergies" style="color: var(--danger); margin-right: 0.5rem;"></i> Allergies</label>
                <textarea name="allergies" rows="4">{{ dossier.allergies }}</textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-notes-medical" style="color: var(--gray); margin-right: 0.5rem;"></i> Autres remarques</label>
                <textarea name="autres_notes" rows="4">{{ dossier.autres_notes }}</textarea>
            </div>

            <div class="form-actions">
                <a href="#" class="btn btn-outline">Annuler</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</body>
</html>
