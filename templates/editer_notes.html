<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Éditer les notes</title>
    <style>
        body { font-family: 'Inter', sans-serif; padding: 2rem; background-color: #f9fafb; }
        form { max-width: 600px; margin: 0 auto; background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; padding: 1rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Notes pour {{ patient.prenom }} {{ patient.nom }}</h1>
<form method="post">
    {% csrf_token %}
    <label for="notes">Notes :</label><br>
    <textarea name="notes" id="notes">{{ patient.notes }}</textarea><br><br>
    <button type="submit">Enregistrer</button>
</form>
</body>
</html>
